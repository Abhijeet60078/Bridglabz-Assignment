<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="f">
  <input id="n" placeholder="Name"><span id="en"></span><br>
  <input id="e" placeholder="Email"><span id="ee"></span><br>
  <input id="p" type="password" placeholder="Password"><span id="ep"></span><br>
  <button>Submit</button>
</form>
<p id="ok"></p>

<script>
f.addEventListener("submit", function (e) {
  e.preventDefault();
  let valid = true;

  if (!n.value) { en.textContent = " required"; valid=false } else en.textContent="";
  if (!e.value.includes("@")) { ee.textContent=" invalid"; valid=false } else ee.textContent="";
  if (p.value.length < 6) { ep.textContent=" min 6"; valid=false } else ep.textContent="";

  if (valid) ok.textContent = "Form Submitted Successfully";
});

[n,e,p].forEach(i => i.oninput = () => ok.textContent="");
</script>

    
</body>
</html>
