<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>Dashboard</h2>
<div id="dash">Loading...</div>

<script>
Promise.all([
  fetch("http://localhost:3004/users").then(r => r.json()),
  fetch("http://localhost:3004/orders").then(r => r.json()),
  fetch("http://localhost:3004/products").then(r => r.json())
])
.then(([users, orders, products]) => {
  document.getElementById("dash").innerHTML =
    `Users: ${users.length}<br>
     Orders: ${orders.length}<br>
     Products: ${products.length}`;
})
.catch(() => {
  document.getElementById("dash").textContent =
    "Some data could not be loaded.";
});
</script>

</body>
</html>
