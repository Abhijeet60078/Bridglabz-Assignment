<!DOCTYPE html>
<html>
<head>
  <title>Timetable</title>
</head>
<body>

<select id="day">
  <option value="">Select Day</option>
  <option value="Monday">Monday</option>
  <option value="Tuesday">Tuesday</option>
</select>

<div id="table"></div>

<script>
document.getElementById("day").onchange = function () {
  let day = this.value;
  let table = document.getElementById("table");
  table.innerHTML = "";

  if (day === "") return;

  fetch("http://localhost:3005/timetable?day=" + day)
    .then(r => r.json())
    .then(data => {
      if (data.length === 0) {
        table.textContent = "No classes today.";
      } else {
        data.forEach(t => {
          table.innerHTML += `<p>${t.subject} - ${t.time}</p>`;
        });
      }
    });
};
</script>

</body>
</html>
